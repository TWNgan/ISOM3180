<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ISOM3180 Midterm 溫習網站</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ISOM3180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { if (localStorage.getItem('isom3180.theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="iconbtn" aria-label="Menu">☰</button>
    <a class="brand" href="#/">ISOM3180<span class="bfull"> Midterm</span><small>Telecom &amp; Networking</small></a>
    <span class="countdown" id="countdown"></span>
    <div class="spacer"></div>
    <label class="search"><input id="searchBox" type="search" placeholder="搜尋（FCS、hub、broadcast…）" autocomplete="off"></label>
    <button id="themeBtn" class="iconbtn" title="切換深色模式">🌓</button>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <button id="toTop" aria-label="Back to top">↑</button>
  <nav class="bottomnav" id="bottomnav">
    <a href="#/" data-key="home"><span class="ic">🏠</span>主頁</a>
    <button type="button" id="notesBtn"><span class="ic">📚</span>筆記</button>
    <a href="#/quiz/mixed" data-key="quiz"><span class="ic">✍️</span>做題</a>
    <a href="#/domains" data-key="domains"><span class="ic">🔢</span>Domain</a>
    <a href="#/flash" data-key="flash"><span class="ic">🃏</span>Cards</a>
  </nav>
  <div class="lightbox" id="lightbox"><img alt=""></div>
  <script src="assets/content.js"></script>
  <script src="assets/diagrams.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
